# BRUH Playhouse Fan Controller
# ────────────────────────────────────────────────────────────
# Fan speed controller for playhouse with variable speed control
# via PWM and multi-click button interface.
#
# Hardware:
#   - Board: ESP32
#   - Motor: DC fan with PWM speed control
# ────────────────────────────────────────────────────────────

esphome:
  name: bruh-playhouse-fan
  friendly_name: "Playhouse Fan"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - platform: ledc
    pin: GPIO14
    id: fan_motor
    frequency: "1000Hz"

fan:
  - platform: speed
    output: fan_motor
    name: "Playhouse Fan"
    id: playhouse_fan

status_led:
  pin:
    number: GPIO2

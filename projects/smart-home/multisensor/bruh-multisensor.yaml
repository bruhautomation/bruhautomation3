# BRUH Multisensor
# ────────────────────────────────────────────────────────────
# ESP8266 room sensor with temperature, humidity, motion
# detection, ambient light level, and an RGB status LED.
#
# Hardware:
#   - Board: NodeMCU v2 (ESP8266)
#   - Sensor: DHT22 on D7 (temperature + humidity)
#   - Sensor: Photoresistor on A0 (ambient light)
#   - Sensor: PIR motion on D5
#   - Output: RGB LED on D1 (red), D2 (green), D3 (blue)
# ────────────────────────────────────────────────────────────

substitutions:
  device_name: "BRUH Multisensor"
  device_id: "bruh-multisensor"

esphome:
  name: ${device_id}

esp8266:
  board: nodemcuv2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  password: !secret ota_password
  platform: esphome

api:

status_led:
  pin:
    number: GPIO2

logger:
  level: ERROR

binary_sensor:
  - platform: gpio
    pin: D5
    name: "${device_name} Motion"
    device_class: motion
  - platform: status
    name: "${device_name} Status"

light:
  - platform: rgb
    name: "${device_name} LED"
    red: red_pwm
    green: green_pwm
    blue: blue_pwm
    effects:
      - flicker:
      - strobe:
      - random:

output:
  - platform: esp8266_pwm
    pin: D1
    id: red_pwm
  - platform: esp8266_pwm
    pin: D2
    id: green_pwm
  - platform: esp8266_pwm
    pin: D3
    id: blue_pwm

sensor:
  - platform: dht
    pin: D7
    model: DHT22
    update_interval: 5s
    temperature:
      name: "${device_name} Temperature"
      filters:
        - lambda: return x * (9.0/5.0) + 32.0;
      unit_of_measurement: "°F"
    humidity:
      name: "${device_name} Humidity"

  - platform: adc
    pin: A0
    name: "${device_name} Luminance"
    update_interval: 2s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 0.0 -> 0.0
          - 0.6 -> 100.0
      - delta: 3.0

  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    update_interval: 300s

switch:
  - platform: restart
    name: "${device_name} Restart"

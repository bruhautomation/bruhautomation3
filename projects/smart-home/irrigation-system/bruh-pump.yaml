# BRUH Irrigation Pump Controller
# ────────────────────────────────────────────────────────────
# Complex irrigation system pump controller with multiple zones,
# flow sensors, TDS/temperature monitoring, and fertilizer dosing.
# Supports 7 irrigation zones with real-time flow monitoring,
# manifold pressure/temperature/TDS measurement, and fertilizer
# inflow/outflow tracking.
#
# Hardware:
#   - Board: ESP32
#   - Sensors: Flow pulse counters (8 total)
#   - Sensors: ADS1115 ADC for pressure, temperature, TDS
#   - Control: PCF8574 I2C expander for 8 zone relays + 2 valves
# ────────────────────────────────────────────────────────────

substitutions:
  device_name: "Pump Box"
  device_id: "pump-box"
  manifold_sensor_power: GPIO4
  i2c_sda: GPIO21
  i2c_scl: GPIO22
  light_pin: GPIO18
  zone_1_name: Garden
  zone_2_name: Blueberries
  zone_3_name: Trees
  zone_4_name: Blackberries
  zone_5_name: Misters
  zone_6_name: Wood Hose
  zone_7_name: Front
  manifold_pulse: GPIO32
  fertilizer_inflow_pulse: GPIO33
  fertilizer_outflow_pulse: GPIO25
  zone_1_pulse: GPIO16
  zone_2_pulse: GPIO17
  zone_3_pulse: GPIO27
  zone_4_pulse: GPIO23
  zone_5_pulse: GPIO14
  zone_6_pulse: GPIO13
  zone_7_pulse: GPIO26

esphome:
  name: ${device_id}
  friendly_name: "${device_name}"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Bruh-Pump Fallback Hotspot"
    password: "wyiXffxhlj1E"

captive_portal:

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true
  id: bus_a

ads1115:
  - address: 0x48
    i2c_id: bus_a
    id: ads1115_1

pcf8574:
  - id: 'pcf8574_hub_1'
    i2c_id: bus_a
    address: 0x27
    pcf8575: true

sensor:
  - platform: pulse_counter
    name: "Manifold Flow Rate"
    id: manifold_flow_rate
    pin:
      number: ${manifold_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 483);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: "Manifold Total"
      id: manifold_total
      filters:
        - lambda: return (x / 483);
      unit_of_measurement: "L"
      device_class: water
      state_class: total_increasing

  - platform: pulse_counter
    name: "EZ-Flo Inflow Rate"
    id: ez_flo_inflow_rate
    pin:
      number: ${fertilizer_inflow_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 898);
    unit_of_measurement: "L/min"
    state_class: measurement
    device_class: volume_flow_rate
    total:
      name: 'EZ-Flo Inflow Total'
      id: ez_flo_inflow_total
      filters:
        - lambda: return (x / 898);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: pulse_counter
    name: "EZ-Flo Outflow Rate"
    id: ez_flo_outflow_rate
    pin:
      number: ${fertilizer_outflow_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 898);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: 'EZ-Flo Outflow Total'
      id: ez_flow_outflow_total
      filters:
        - lambda: return (x / 898);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: pulse_counter
    name: "Z1 Flow"
    id: zone_1_flow
    pin:
      number: ${zone_1_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 660);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: "Z1 Total"
      id: zone_1_total
      filters:
        - lambda: return (x / 660);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: pulse_counter
    name: "Z2 Flow"
    id: zone_2_flow
    pin:
      number: ${zone_2_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 20s
    filters:
      - lambda: return (x / 660);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: "Z2 Total"
      id: zone_2_total
      filters:
        - lambda: return (x / 660);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: pulse_counter
    name: "Z3 Flow"
    id: zone_3_flow
    pin:
      number: ${zone_3_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 660);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: "Z3 Total"
      id: zone_3_total
      filters:
        - lambda: return (x / 660);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: pulse_counter
    name: "Z4 Flow"
    id: zone_4_flow
    pin:
      number: ${zone_4_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 660);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: "Z4 Total"
      id: zone_4_total
      filters:
        - lambda: return (x / 660);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: pulse_counter
    name: "Z5 Flow"
    id: zone_5_flow
    pin:
      number: ${zone_6_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 660);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: "Z5 Total"
      id: zone_5_total
      filters:
        - lambda: return (x / 660);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: pulse_counter
    name: "Z6 Flow"
    id: zone_6_flow
    pin:
      number: ${zone_5_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 660);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: "Z6 Total"
      id: zone_6_total
      filters:
        - lambda: return (x / 660);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: pulse_counter
    name: "Z7 Flow"
    id: zone_7_flow
    pin:
      number: ${zone_7_pulse}
      mode:
        input: true
        pullup: true
    update_interval: 10s
    filters:
      - lambda: return (x / 660);
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    total:
      name: "Z7 Total"
      id: zone_7_total
      filters:
        - lambda: return (x / 660);
      unit_of_measurement: "L"
      device_class: volume
      state_class: total_increasing

  - platform: ads1115
    multiplexer: 'A0_GND'
    ads1115_id: ads1115_1
    name: "Manifold Pressure"
    update_interval: 5s
    unit_of_measurement: "psi"
    device_class: pressure
    gain: 6.144
    filters:
      - calibrate_linear:
          - 0.0 -> 0.5
          - 5 -> 80.0

  - platform: ads1115
    multiplexer: 'A2_GND'
    gain: 6.144
    name: "Raw Manifold Temperature Voltage"
    id: manifold_raw_temperature_voltage
    update_interval: 10s
    unit_of_measurement: "V"
    accuracy_decimals: 3
    internal: false

  - platform: resistance
    id: manifold_temp_resistance
    sensor: manifold_raw_temperature_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Manifold Raw Resistance"
    internal: false

  - platform: ntc
    sensor: manifold_temp_resistance
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: "Manifold Temperature"
    id: manifold_water_temperature

  - platform: ads1115
    multiplexer: 'A1_GND'
    gain: 6.144
    update_interval: 10s
    name: "Manifold Raw TDS Voltage"
    ads1115_id: ads1115_1
    id: manifold_raw_tds_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    internal: false

  - platform: template
    name: "Manifold Compensated TDS Voltage"
    update_interval: 10s
    id: manifold_compensated_tds_voltage
    unit_of_measurement: 'V'
    accuracy_decimals: 3
    lambda: 'return ((id(manifold_raw_tds_voltage).state) / (1 + (0.02 * (id(manifold_water_temperature).state - 25.0))));'
    internal: false

  - platform: template
    name: "Manifold Uncalibrated TDS"
    update_interval: 10s
    id: manifold_tds_uncalibrated
    icon: "hass:water-opacity"
    unit_of_measurement: 'PPM'
    accuracy_decimals: 0
    lambda: 'return (133.42 * (id(manifold_compensated_tds_voltage).state) * 3 - 255.86 * (id(manifold_compensated_tds_voltage).state) * 2 + 857.39 * id(manifold_compensated_tds_voltage).state) * 0.5;'

  - platform: template
    name: "Manifold Calibrated TDS"
    update_interval: 10s
    id: manifold_tds_calibrated
    icon: "hass:water-opacity"
    unit_of_measurement: 'PPM'
    accuracy_decimals: 0
    lambda: return id(manifold_tds_uncalibrated).state;
    filters:
      - calibrate_linear:
          - 22 -> 22
          - 1040 -> 700
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

switch:
  - platform: gpio
    name: "Zone 1"
    pin:
      pcf8574: pcf8574_hub_1
      number: 0
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Zone 2"
    pin:
      pcf8574: pcf8574_hub_1
      number: 1
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Zone 3"
    pin:
      pcf8574: pcf8574_hub_1
      number: 2
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Zone 4"
    pin:
      pcf8574: pcf8574_hub_1
      number: 3
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Zone 5"
    pin:
      pcf8574: pcf8574_hub_1
      number: 4
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Zone 6"
    pin:
      pcf8574: pcf8574_hub_1
      number: 5
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Zone 7"
    pin:
      pcf8574: pcf8574_hub_1
      number: 6
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Pump Water Valve"
    pin:
      pcf8574: pcf8574_hub_1
      number: 14
      mode:
        output: true
      inverted: true
  - platform: gpio
    name: "Fertilizer Output Valve"
    pin:
      pcf8574: pcf8574_hub_1
      number: 15
      mode:
        output: true
      inverted: true

output:
  - platform: ledc
    pin: ${light_pin}
    id: light_pin
    frequency: "19531Hz"

light:
  - platform: monochromatic
    output: light_pin
    name: "Pump Box"
    id: cob_panel
    default_transition_length: 0.5s

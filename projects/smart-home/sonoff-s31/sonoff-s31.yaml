# Sonoff S31 Smart Plug
# ────────────────────────────────────────────────────────────
# Sonoff S31 plug with real-time power monitoring via CSE7766
# power metering chip. Includes relay control, LED indicator,
# and physical button.
#
# Hardware:
#   - Board: ESP8266 (esp01_1m)
#   - Power Meter: CSE7766
#   - Output: Relay on GPIO12
#   - LED: GPIO13
# ────────────────────────────────────────────────────────────

substitutions:
  device_name: "Sonoff S31"
  device_id: "sonoff-s31"

esphome:
  name: ${device_id}

esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  password: !secret ota_password
  platform: esphome

api:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - if:
            condition:
              light.is_on: led
            then:
              - light.turn_off: led
            else:
              - light.turn_on: led
    name: "${device_name} button"
  - platform: status
    name: "${device_name} Status"

uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

light:
  - platform: monochromatic
    id: led
    name: "${device_name} LED"
    output: output_pin
    effects:
      - flicker:
      - strobe:

output:
  - platform: esp8266_pwm
    id: output_pin
    pin:
      number: GPIO13
      inverted: true

sensor:
  - platform: cse7766
    current:
      name: "${device_name} Outlet Current"
      filters:
        - throttle_average: 5s
    voltage:
      name: "${device_name} Outlet Voltage"
      filters:
        - throttle_average: 5s
    power:
      name: "${device_name} Outlet Power"
      filters:
        - throttle_average: 5s

  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    update_interval: 300s

switch:
  - platform: gpio
    id: relay
    name: "${device_name} relay"
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_ON
  - platform: restart
    name: "${device_name} Restart"

status_led:
  pin:
    number: GPIO13
    inverted: true

time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

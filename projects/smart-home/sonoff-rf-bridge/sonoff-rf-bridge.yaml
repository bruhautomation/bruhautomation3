# Sonoff RF Bridge
# ────────────────────────────────────────────────────────────
# 433MHz RF bridge for receiving and transmitting RF codes.
# Allows integration of wireless RF remotes and sensors
# with Home Assistant.
#
# Hardware:
#   - Board: ESP8266 (esp01_1m)
#   - Protocol: RF 433MHz via RF Bridge module
# ────────────────────────────────────────────────────────────

substitutions:
  device_name: "Sonoff RF Bridge"
  device_id: "sonoff-rf-bridge"

esphome:
  name: ${device_id}

esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  password: !secret ota_password
  platform: esphome

api:
  services:
    - service: send_rf_code
      variables:
        sync: int
        low: int
        high: int
        code: int
      then:
        - rf_bridge.send_code:
            sync: !lambda 'return sync;'
            low: !lambda 'return low;'
            high: !lambda 'return high;'
            code: !lambda 'return code;'
    - service: learn
      then:
        - rf_bridge.learn

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 19200

logger:
  baud_rate: 0

rf_bridge:
  on_code_received:
    then:
      - homeassistant.event:
          event: esphome.rf_code_received
          data:
            sync: !lambda 'return format_hex(data.sync);'
            low: !lambda 'return format_hex(data.low);'
            high: !lambda 'return format_hex(data.high);'
            code: !lambda 'return format_hex(data.code);'

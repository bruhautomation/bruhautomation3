# BRUH Nightlight (Monochromatic)
# ────────────────────────────────────────────────────────────
# Simple LED nightlight with PWM brightness control and
# pulse effects. LEDC PWM output for smooth dimming.
#
# Hardware:
#   - Board: ESP32
#   - Output: LEDC PWM on GPIO32
# ────────────────────────────────────────────────────────────

substitutions:
  device_name: "BRUH Countertop"
  device_id: "bubba-nightlight"

globals:
  - id: dim_up
    type: float
    restore_value: yes
    initial_value: '1.0'

esphome:
  name: ${device_id}

esp32:
  board: nodemcu-32s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  password: !secret ota_password
  platform: esphome

api:

status_led:
  pin:
    number: GPIO2

logger:

output:
  - platform: ledc
    pin: GPIO32
    id: gpio_32
    frequency: "1220Hz"

light:
  - platform: monochromatic
    output: gpio_32
    restore_mode: restore_default_on
    name: "Nightlight"
    id: nightlight
    default_transition_length: 0.5s
    effects:
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
      - pulse:
          name: "Slow Pulse"
          update_interval: 2s
      - strobe:
      - random:
      - automation:
          name: "Fade Alert"
          sequence:
            - light.turn_on:
                id: nightlight
                brightness: 100%
                transition_length: 1s
            - delay: 1s
            - light.turn_on:
                id: nightlight
                brightness: 75%
                transition_length: 1s
            - delay: 1s

binary_sensor:
  - platform: status
    name: "${device_name} Status"

sensor:
  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    update_interval: 300s

switch:
  - platform: restart
    name: "${device_name} Restart"

# BRUH Neopixel Strip
# ────────────────────────────────────────────────────────────
# Simple addressable RGB LED strip controller with
# multiple light effects and WiFi integration.
#
# Hardware:
#   - Board: ESP8266
#   - Output: WS2812B/NeoPixel strip (24 LEDs)
# ────────────────────────────────────────────────────────────

substitutions:
  device_name: "BRUH Light"
  device_id: "bruh-light"

esphome:
  name: ${device_id}

esp8266:
  board: nodemcuv2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  password: !secret ota_password
  platform: esphome

api:

status_led:
  pin:
    number: GPIO2

logger:

binary_sensor:
  - platform: status
    name: "${device_name} Status"

light:
  - platform: neopixelbus
    type: GRB
    pin: GPIO3
    num_leds: 24
    name: "${device_name}"
    variant: 800KBPS
    method: ESP8266_DMA
    effects:
      - flicker:
      - strobe:
      - random:
      - addressable_rainbow:
      - addressable_scan:
      - addressable_color_wipe:
      - addressable_twinkle:
      - addressable_random_twinkle:
      - addressable_fireworks:
      - addressable_flicker:

sensor:
  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    update_interval: 300s

switch:
  - platform: restart
    name: "${device_name} Restart"

# BRUH Smart Button Switch
# ────────────────────────────────────────────────────────────
# Multi-click button controller with rotary encoder support and
# addressable LED feedback. Supports single click, double click,
# triple click, and long press actions with custom effects.
#
# Hardware:
#   - Board: ESP32
#   - Input: Rotary encoder with push button
#   - Output: 8-LED NeoPixel strip for feedback
# ────────────────────────────────────────────────────────────

substitutions:
  device_name: "BRUH Switch"
  device_id: "bruh-switch-2"

esphome:
  name: ${device_id}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO22
      inverted: yes
      mode:
        input: true
        pullup: true
    id: encoder_sw
    name: "${device_name} Button"
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - text_sensor.template.publish:
              id: last_action
              state: "five click"
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - text_sensor.template.publish:
              id: last_action
              state: "four click"
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - text_sensor.template.publish:
              id: last_action
              state: "triple click"
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - text_sensor.template.publish:
              id: last_action
              state: "double click"
      - timing:
          - ON for at least 1s
        then:
          - text_sensor.template.publish:
              id: last_action
              state: "single long click"
          - number.set:
              id: switch_1_value
              value: !lambda 'return id(switch_1_value).state - 1;'
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - text_sensor.template.publish:
              id: last_action
              state: "single short click"
          - number.set:
              id: switch_1_value
              value: !lambda 'return id(switch_1_value).state + 1;'

switch:
  - platform: template
    name: "${device_name} Alert Mode"
    id: alert_mode
    optimistic: true

text_sensor:
  - platform: template
    name: "${device_name} Action"
    id: last_action
    on_value:
      then:
        - delay: 1s
        - if:
            condition:
              lambda: 'return id(last_action).state != "standby";'
            then:
              - text_sensor.template.publish:
                  id: last_action
                  state: "standby"

  - platform: template
    id: last_message_line_1
    internal: true

  - platform: template
    id: last_message_line_2
    internal: true

light:
  - platform: neopixelbus
    variant: 800KBPS
    type: GRB
    pin: GPIO13
    id: led
    num_leds: 8
    name: "${device_name} LED"
    default_transition_length: 500ms
    effects:
      - flicker:
      - flicker:
          name: "Flicker BRUH"
          alpha: 92%
          intensity: 4%
      - strobe:
      - random:
      - addressable_rainbow:
      - addressable_scan:
      - addressable_color_wipe:
      - addressable_color_wipe:
          name: "Police"
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 6
            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 6
          add_led_interval: 30ms
          reverse: false
      - addressable_twinkle:
      - addressable_twinkle:
          name: "Twinkle BRUH"
          twinkle_probability: 80%
          progress_interval: 4ms
      - addressable_random_twinkle:
      - addressable_fireworks:
      - addressable_flicker:
      - addressable_flicker:
          name: "Addressable Flicker BRUH"
          update_interval: 25ms
          intensity: 15%
      - addressable_lambda:
          name: "Status"
          update_interval: 50ms
          lambda: |-
            int r = id(led).current_values.get_red() * 255;
            int g = id(led).current_values.get_green() * 255;
            int b = id(led).current_values.get_blue() * 255;
            int brightness = id(led).current_values.get_brightness() * 255;

            int ledArray[] { 0, 1, 2, 3, 4, 5, 6, 7};
            int pos;

            for (int i = 8 - 1; i >= 0; i--) {
              pos = ledArray[i];

              if (pos >= id(switch_1_value).state) {
                it[pos] = Color(0, 0, 0);
              } else {
                it[pos] = Color(r, g, b);
              }
            }

number:
  - platform: template
    id: switch_1_value
    name: "${device_name} Switch 1"
    internal: false
    optimistic: true
    min_value: 0
    max_value: 7
    step: 1

esp32_ble_tracker:

sensor:
  - platform: xiaomi_hhccjcy01
    mac_address: "DC:23:4D:E5:62:8C"
    temperature:
      name: "Yard 1 Temperature"
    moisture:
      name: "Yard 1 Moisture"
    illuminance:
      name: "Yard 1 Illuminance"
    conductivity:
      name: "Yard 1 Soil Conductivity"
    battery_level:
      name: "Yard 1 Battery Level"

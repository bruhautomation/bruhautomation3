# Sonoff S20 Smart Plug
# ────────────────────────────────────────────────────────────
# Basic Sonoff S20 smart plug without power monitoring.
# Relay control, LED indicator, and physical button.
#
# Hardware:
#   - Board: ESP8266 (esp01_1m)
#   - Output: Relay on GPIO12
#   - LED: GPIO13
# ────────────────────────────────────────────────────────────

substitutions:
  device_name: "Sonoff S20"
  device_id: "sonoff-s20"

esphome:
  name: ${device_id}

esp8266:
  board: esp01_1m
  board_flash_mode: dout

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  password: !secret ota_password
  platform: esphome

api:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - if:
            condition:
              switch.is_on: relay
            then:
              - switch.turn_off: relay
              - light.turn_off: led
            else:
              - switch.turn_on: relay
              - light.turn_on: led
    name: "${device_name} button"
  - platform: status
    name: "${device_name} Status"

light:
  - platform: monochromatic
    id: led
    name: "${device_name} LED"
    output: output_pin
    effects:
      - flicker:
      - strobe:

output:
  - platform: esp8266_pwm
    id: output_pin
    pin:
      number: GPIO13
      inverted: true

sensor:
  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    update_interval: 300s

switch:
  - platform: gpio
    id: relay
    name: "${device_name} relay"
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_ON
  - platform: restart
    name: "${device_name} Restart"

status_led:
  pin:
    number: GPIO13
    inverted: true

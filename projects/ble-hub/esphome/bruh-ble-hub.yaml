# BRUH BLE Hub
# ────────────────────────────────────────────────────────────
# Bluetooth Low Energy tracker and proxy hub.
# Tracks iBeacon devices and provides BLE proxy functionality
# for Home Assistant integration.
#
# Hardware:
#   - Board: ESP32
# ────────────────────────────────────────────────────────────

esphome:
  name: bruh-ble-hub-1

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Bruh-Ble-Hub-1 Fallback Hotspot"
    password: !secret ap_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    duration: 30s
    active: false
    continuous: true

bluetooth_proxy:
  active: true

binary_sensor:
  - platform: ble_presence
    ibeacon_uuid: '426C7565-4368-6172-6D42-6561636F6E73'
    name: "Trash Can"

  - platform: ble_presence
    ibeacon_uuid: '426C7565-4368-6172-6D42-6561636F6E74'
    name: "Trash Can Motion"

  - platform: ble_presence
    ibeacon_uuid: '426C7565-4368-6172-6D42-6561636F6E79'
    name: "Trash Can Button"

sensor:
  - platform: ble_rssi
    ibeacon_uuid: '426C7565-4368-6172-6D42-6561636F6E73'
    name: "Trash Can RSSI"

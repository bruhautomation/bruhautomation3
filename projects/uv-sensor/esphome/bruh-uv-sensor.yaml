# BRUH UV Sensor
# ────────────────────────────────────────────────────────────
# UV light sensor with environmental monitoring.
# Features LTR390 UV sensor, BME280 environmental sensor,
# and OLED display for real-time readings.
#
# Hardware:
#   - Board: ESP32
#   - Sensor: LTR390 (UV index and light level)
#   - Sensor: BME280 (temperature, pressure, humidity)
#   - Display: SSD1306 OLED 128x64
# ────────────────────────────────────────────────────────────

esphome:
  name: bruh-uv-sensor-1
  friendly_name: "BRUH UV Sensor"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Bruh-Uv-Sensor-1"
    password: !secret ap_password

captive_portal:

i2c:
  - id: bus_a
    sda: GPIO5
    scl: GPIO4
    scan: false
    frequency: 400kHz
  - id: bus_b
    sda: GPIO17
    scl: GPIO16
    scan: true
    frequency: 400kHz

sensor:
  - platform: ltr390
    update_interval: 10s
    i2c_id: bus_a
    uv_index:
      name: "UV index"
      id: uv_index
    uv:
      name: "UV sensor counts"
      id: uv_counts
      filters:
        - delta: 1
    light:
      name: "light"
      id: light
      filters:
        - delta: 1
      on_value:
        then:
          - component.update: my_display
    ambient_light:
      name: "light sensor counts"
      id: light_counts

  - platform: bme280_i2c
    i2c_id: bus_b
    temperature:
      name: "temperature"
      oversampling: 16x
    pressure:
      name: "pressure"
    humidity:
      name: "humidity"
    address: 0x76
    update_interval: 30s

display:
  - platform: ssd1306_i2c
    id: my_display
    i2c_id: bus_a
    model: "SSD1306 128x64"
    rotation: 180
    address: 0x3C
    lambda: |-
      it.printf(5, 5, id(font1), "light:  %.0f lx", id(light).state);
      it.printf(5, 40, id(font1), "UV:  %.0f", id(uv_index).state);

font:
  - file: 'Roboto-Medium.ttf'
    id: font1
    size: 15

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="BRUH Claude selected as the conversation agent in Home Assistant Settings, Voice Assistants">
  <defs>
    <linearGradient id="vabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="439" rx="14" fill="url(#vabg)" stroke="#30363d"/>

  <!-- breadcrumb / header -->
  <text x="28" y="40" fill="#8b949e" font-size="13">Settings</text>
  <text x="86" y="40" fill="#8b949e" font-size="13">›</text>
  <text x="100" y="40" fill="#8b949e" font-size="13">Voice assistants</text>
  <text x="234" y="40" fill="#8b949e" font-size="13">›</text>
  <text x="248" y="40" fill="#e6edf3" font-size="13" font-weight="600">Home Assistant</text>
  <line x1="0" y1="58" x2="720" y2="58" stroke="#30363d"/>

  <!-- assist pipeline card -->
  <rect x="28" y="80" width="664" height="332" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="52" y="112" fill="#e6edf3" font-size="17" font-weight="700">Assist pipeline</text>
  <text x="52" y="134" fill="#8b949e" font-size="13">Configure how this assistant understands and responds.</text>

  <!-- Name field -->
  <text x="52" y="172" fill="#8b949e" font-size="12">NAME</text>
  <rect x="52" y="182" width="616" height="40" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="68" y="207" fill="#c9d1d9" font-size="14">Home Assistant</text>

  <!-- Conversation agent field (focused, set to BRUH Claude) -->
  <text x="52" y="252" fill="#58a6ff" font-size="12" font-weight="600">CONVERSATION AGENT</text>
  <rect x="52" y="262" width="616" height="44" rx="8" fill="#0d1117" stroke="#1e90ff" stroke-opacity="0.7"/>
  <circle cx="80" cy="284" r="11" fill="#f0883e" fill-opacity="0.18" stroke="#f0883e" stroke-opacity="0.5"/>
  <text x="80" y="289" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">C</text>
  <text x="102" y="289" fill="#e6edf3" font-size="15" font-weight="600">BRUH Claude</text>
  <text x="646" y="289" text-anchor="end" fill="#8b949e" font-size="16">⌄</text>

  <!-- dropdown showing options -->
  <rect x="52" y="312" width="616" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <rect x="56" y="316" width="608" height="24" rx="5" fill="#1e90ff" fill-opacity="0.14"/>
  <text x="68" y="333" fill="#58a6ff" font-size="13" font-weight="600">BRUH Claude</text>
  <text x="656" y="333" text-anchor="end" fill="#3fb950" font-size="13">✓</text>
  <text x="68" y="357" fill="#8b949e" font-size="13">Home Assistant (default)</text>
  <text x="68" y="381" fill="#8b949e" font-size="13">Google Generative AI</text>
</svg>

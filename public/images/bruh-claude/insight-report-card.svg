<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="A BRUH Claude insight report rendered as a Markdown card on a Home Assistant dashboard">
  <defs>
    <linearGradient id="dashbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- dashboard backdrop -->
  <rect x="0.5" y="0.5" width="639" height="459" rx="14" fill="url(#dashbg)" stroke="#30363d"/>
  <text x="28" y="40" fill="#e6edf3" font-size="16" font-weight="700">Home</text>
  <circle cx="600" cy="34" r="12" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="39" text-anchor="middle" fill="#8b949e" font-size="13">⋮</text>
  <line x1="0" y1="58" x2="640" y2="58" stroke="#30363d"/>

  <!-- markdown card -->
  <rect x="28" y="80" width="584" height="352" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- card title -->
  <circle cx="52" cy="112" r="10" fill="#f0883e" fill-opacity="0.18" stroke="#f0883e" stroke-opacity="0.5"/>
  <text x="52" y="117" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="700">C</text>
  <text x="72" y="118" fill="#e6edf3" font-size="17" font-weight="700">Morning Briefing</text>
  <text x="588" y="118" text-anchor="end" fill="#8b949e" font-size="12">07:00</text>
  <line x1="48" y1="132" x2="592" y2="132" stroke="#30363d"/>

  <!-- body: markdown-rendered report -->
  <g font-size="13.5">
    <text x="48" y="162" fill="#58a6ff" font-size="14" font-weight="700">Overnight</text>
    <text x="48" y="186" fill="#c9d1d9">• Low of <tspan fill="#e6edf3" font-weight="600">34°F</tspan> at 5:12 AM — coldest so far this week.</text>
    <text x="48" y="208" fill="#c9d1d9">• Garage door was left open from 11:04 PM to 11:22 PM.</text>
    <text x="48" y="230" fill="#c9d1d9">• Back-porch motion at 2:41 AM (raccoon, per camera).</text>

    <text x="48" y="266" fill="#58a6ff" font-size="14" font-weight="700">Today</text>
    <text x="48" y="290" fill="#c9d1d9">• Rain likely after 3 PM — <tspan fill="#e6edf3" font-weight="600">bring the patio cushions in</tspan>.</text>
    <text x="48" y="312" fill="#c9d1d9">• Trash pickup is tomorrow; bins not out yet.</text>

    <text x="48" y="348" fill="#58a6ff" font-size="14" font-weight="700">Needs attention</text>
  </g>

  <!-- alert chip -->
  <rect x="48" y="360" width="544" height="30" rx="8" fill="#f0883e" fill-opacity="0.12" stroke="#f0883e" stroke-opacity="0.45"/>
  <text x="64" y="380" fill="#f0883e" font-size="13">⚠ Front-door battery at 12% — replace soon.</text>

  <!-- footer meta -->
  <text x="48" y="414" fill="#6e7681" font-size="12">sensor.morning_briefing_insight · updated 2 min ago</text>
</svg>

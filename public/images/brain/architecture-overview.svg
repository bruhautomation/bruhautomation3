<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#1e90ff;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0883e;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#f0883e;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1e90ff" opacity="0.7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950" opacity="0.7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a371f7" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="600">brAIn — Architecture Overview</text>

  <!-- HA Core box -->
  <rect x="30" y="60" width="250" height="200" rx="10" fill="url(#blueGrad)" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="155" y="86" text-anchor="middle" fill="#1e90ff" font-size="13" font-weight="600">HOME ASSISTANT CORE</text>
  <rect x="50" y="100" width="210" height="30" rx="6" fill="#1e90ff" fill-opacity="0.12" stroke="#1e90ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="155" y="120" text-anchor="middle" fill="#c9d1d9" font-size="11">Conversation Agent (Assist)</text>
  <rect x="50" y="140" width="210" height="30" rx="6" fill="#1e90ff" fill-opacity="0.12" stroke="#1e90ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="155" y="160" text-anchor="middle" fill="#c9d1d9" font-size="11">Automations &amp; Services</text>
  <rect x="50" y="180" width="210" height="30" rx="6" fill="#1e90ff" fill-opacity="0.12" stroke="#1e90ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="155" y="200" text-anchor="middle" fill="#c9d1d9" font-size="11">Usage &amp; Learning Sensors</text>
  <rect x="50" y="220" width="210" height="30" rx="6" fill="#1e90ff" fill-opacity="0.12" stroke="#1e90ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="155" y="240" text-anchor="middle" fill="#c9d1d9" font-size="11">brain custom_component</text>

  <!-- Add-on Container box -->
  <rect x="330" y="60" width="540" height="340" rx="10" fill="url(#greenGrad)" stroke="#3fb950" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="600" y="86" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">BRAIN ADD-ON CONTAINER</text>

  <!-- Web Terminal -->
  <rect x="355" y="100" width="170" height="60" rx="8" fill="url(#purpleGrad)" stroke="#a371f7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="440" y="126" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="600">Ingress Panel · 8099</text>
  <text x="440" y="146" text-anchor="middle" fill="#8b949e" font-size="10">Insights · Terminal · Memory</text>

  <!-- Claude Code -->
  <rect x="560" y="100" width="170" height="60" rx="8" fill="url(#orangeGrad)" stroke="#f0883e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="645" y="126" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="600">Claude Code</text>
  <text x="645" y="146" text-anchor="middle" fill="#8b949e" font-size="10">Anthropic API</text>

  <!-- MCP Server -->
  <rect x="355" y="185" width="170" height="60" rx="8" fill="url(#blueGrad)" stroke="#1e90ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="440" y="211" text-anchor="middle" fill="#1e90ff" font-size="12" font-weight="600">HA MCP Server</text>
  <text x="440" y="231" text-anchor="middle" fill="#8b949e" font-size="10">stdio • 36 tools</text>

  <!-- Listeners -->
  <rect x="560" y="185" width="170" height="60" rx="8" fill="url(#blueGrad)" stroke="#1e90ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="645" y="211" text-anchor="middle" fill="#1e90ff" font-size="12" font-weight="600">IPC Listeners</text>
  <text x="645" y="231" text-anchor="middle" fill="#8b949e" font-size="10">Assist + Automation</text>

  <!-- CLI Tools -->
  <rect x="355" y="270" width="170" height="55" rx="8" fill="url(#purpleGrad)" stroke="#a371f7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="440" y="293" text-anchor="middle" fill="#a371f7" font-size="12" font-weight="600">CLI</text>
  <text x="440" y="311" text-anchor="middle" fill="#8b949e" font-size="10">brain • ha</text>

  <!-- Background Services -->
  <rect x="560" y="270" width="290" height="55" rx="8" fill="url(#orangeGrad)" stroke="#f0883e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="705" y="293" text-anchor="middle" fill="#f0883e" font-size="12" font-weight="600">Background Services</text>
  <text x="705" y="311" text-anchor="middle" fill="#8b949e" font-size="10">worker-pool • usage-tracker • memory consolidator</text>

  <!-- File-Based IPC box -->
  <rect x="30" y="290" width="250" height="110" rx="10" fill="url(#orangeGrad)" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="155" y="316" text-anchor="middle" fill="#f0883e" font-size="13" font-weight="600">FILE-BASED IPC</text>
  <text x="155" y="340" text-anchor="middle" fill="#8b949e" font-size="10">/config/.brain/</text>
  <text x="155" y="360" text-anchor="middle" fill="#c9d1d9" font-size="10">requests/ → responses/</text>
  <text x="155" y="378" text-anchor="middle" fill="#c9d1d9" font-size="10">tasks/ → task_results/</text>
  <text x="155" y="396" text-anchor="middle" fill="#c9d1d9" font-size="10">usage_limits.json • logs/</text>

  <!-- Persistent Storage -->
  <rect x="330" y="420" width="540" height="80" rx="10" fill="url(#purpleGrad)" stroke="#a371f7" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="600" y="446" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="600">PERSISTENT STORAGE (/data)</text>
  <text x="425" y="476" text-anchor="middle" fill="#8b949e" font-size="10">OAuth Credentials</text>
  <text x="575" y="476" text-anchor="middle" fill="#8b949e" font-size="10">Edit Journal</text>
  <text x="710" y="476" text-anchor="middle" fill="#8b949e" font-size="10">Installed Packages</text>
  <text x="830" y="476" text-anchor="middle" fill="#8b949e" font-size="10">CLAUDE.md</text>

  <!-- Arrows: HA Core ↔ IPC -->
  <line x1="155" y1="260" x2="155" y2="288" stroke="#f0883e" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowBlue)" stroke-dasharray="4,3"/>

  <!-- Arrows: IPC ↔ Listeners -->
  <line x1="280" y1="345" x2="558" y2="215" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowBlue)" stroke-dasharray="4,3"/>

  <!-- Arrows: Web Terminal → Claude Code -->
  <line x1="525" y1="130" x2="558" y2="130" stroke="#a371f7" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowPurple)"/>

  <!-- Arrows: Claude Code → MCP -->
  <line x1="620" y1="160" x2="510" y2="190" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowBlue)"/>

  <!-- Arrows: MCP → HA API -->
  <line x1="355" y1="215" x2="280" y2="155" stroke="#1e90ff" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowBlue)" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="30" y="430" width="250" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="50" cy="448" r="4" fill="#1e90ff"/><text x="62" y="452" fill="#8b949e" font-size="10">HA API / Integration</text>
  <circle cx="50" cy="468" r="4" fill="#3fb950"/><text x="62" y="472" fill="#8b949e" font-size="10">Add-on Container</text>
  <circle cx="160" cy="448" r="4" fill="#a371f7"/><text x="172" y="452" fill="#8b949e" font-size="10">User Interface</text>
  <circle cx="160" cy="468" r="4" fill="#f0883e"/><text x="172" y="472" fill="#8b949e" font-size="10">Data / IPC</text>
  <line x1="48" y1="488" x2="72" y2="488" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="80" y="492" fill="#8b949e" font-size="10">Cross-boundary</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="The BRUH Minecraft panel tab bar: Dashboard, Console, Players, Server Properties, Plugins, Backups, and Worlds">
  <defs>
    <linearGradient id="tabsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="131" rx="14" fill="url(#tabsbg)" stroke="#30363d"/>

  <!-- title row -->
  <text x="28" y="40" fill="#e6edf3" font-size="16" font-weight="700">BRUH Minecraft</text>
  <circle cx="196" cy="35" r="5" fill="#3fb950"/>
  <text x="208" y="40" fill="#3fb950" font-size="12" font-weight="600">Running</text>
  <line x1="0" y1="58" x2="820" y2="58" stroke="#30363d"/>

  <!-- tabs -->
  <g font-size="14">
    <rect x="24" y="76" width="112" height="36" rx="9" fill="#1e90ff" fill-opacity="0.16" stroke="#1e90ff" stroke-opacity="0.55"/>
    <text x="80" y="99" text-anchor="middle" fill="#58a6ff" font-weight="600">Dashboard</text>

    <rect x="146" y="76" width="92" height="36" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="192" y="99" text-anchor="middle" fill="#c9d1d9">Console</text>

    <rect x="248" y="76" width="88" height="36" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="292" y="99" text-anchor="middle" fill="#c9d1d9">Players</text>

    <rect x="346" y="76" width="150" height="36" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="421" y="99" text-anchor="middle" fill="#c9d1d9">Server Properties</text>

    <rect x="506" y="76" width="86" height="36" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="549" y="99" text-anchor="middle" fill="#c9d1d9">Plugins</text>

    <rect x="602" y="76" width="90" height="36" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="647" y="99" text-anchor="middle" fill="#c9d1d9">Backups</text>

    <rect x="702" y="76" width="90" height="36" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="747" y="99" text-anchor="middle" fill="#c9d1d9">Worlds</text>
  </g>
</svg>
